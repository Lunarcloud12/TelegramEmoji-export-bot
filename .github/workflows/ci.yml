name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
      - run: python scripts/package_source.py
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t emoji-export-bot .
      - name: Check media encoders without a bot token
        run: docker run --rm emoji-export-bot python -m emojigif.check
